<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>速算對決</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 2.5em;
      margin-top: 1em;
      margin-bottom: 0.3em;
      word-break: keep-all;
    }
    #home, #game {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    #home.active, #game.active {
      display: flex;
    }
    #history {
      font-size: 1em;
      margin: 1em 0;
      color: #ccc;
      text-align: center;
    }
    #recordTable {
      border-collapse: collapse;
      margin-bottom: 1em;
    }
    #recordTable td, #recordTable th {
      border: 1px solid #ccc;
      padding: 6px 12px;
      text-align: center;
    }
    #recordTable th {
      background: #333;
      color: #fff;
    }
    #question {
      font-size: 2.2em;
      background: #1c1c1c;
      border-radius: 15px;
      padding: 10px 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
      word-break: break-word;
      text-align: center;
      max-width: 90vw;
    }
    .flash {
      animation: flash 1s ease-in-out 3;
    }
    @keyframes flash {
      0% { color: #ff6666; }
      50% { color: #ffffff; }
      100% { color: #ff6666; }
    }
    #info {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .num-buttons {
  display: grid;
  grid-template-columns: repeat(4, minmax(50px, 70px));
  gap: 12px;
  justify-content: center;
  margin-bottom: 30px;
}
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6em;
      background-color: #00d1ff;
      border: none;
      border-radius: 10px;
      width: 60px;
      height: 60px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
      background-color: #00a3cc;
    }
    .end {
      color: #ff6666;
      font-size: 1.5em;
      display: block;
      white-space: pre-line;
      text-align: center;
    }
    .back-btn {
  font-size: 1.2em;
  margin-top: 20px;
  padding: 14px 28px;
  background-color: #00ffcc;
  color: #000;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
    .start-btn {
      font-size: 1.2em;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: #000;
      cursor: pointer;
      margin-top: 20px;
    }
    footer {
      margin-top: auto;
      font-size: 0.8em;
      color: #999;
      padding-top: 20px;
    }
  @keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 480px) {
  .btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 50px;
    height: 50px;
    font-size: 1.2em;
  }
  .num-buttons {
    gap: 10px;
  }
}
</style>
</head>
<body>
  <h1>速算對決</h1>
  <div id="home" class="active">
    <p style="text-align: center; white-space: pre-line;">
你有 30 秒的時間，
盡可能針對題目回答正確的數字，
題目有加法、減法、乘法或除法（答案僅限 1~12）。

📗 簡單：題目數字為 1~20，答題按鈕為 1~9
📕 困難：題目數字為雙位數，答題按鈕為 1~12，包含更多乘除題型
</p>
    <div id="history">
      <table id="recordTable">
        <tr><th>近期紀錄</th><td id="recent1">--</td><td id="recent2">--</td><td id="recent3">--</td></tr>
        <tr><th>最佳紀錄</th><td colspan="3" id="bestRecord">--</td></tr>
      </table>
    </div>
    <div style="text-align: center; margin-top: 20px; animation: fadeIn 1s ease-in-out;">
  <p style="font-size: 1.3em; font-weight: bold; margin-bottom: 10px;">請選擇難度</p>
  <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
    <button class="start-btn" style="background-color: #66ff66;" onclick="setDifficulty('easy')">🟢 簡單</button>
        <button class="start-btn" style="background-color: #ff6666;" onclick="setDifficulty('hard')">🔴 困難</button>
  </div>
</div>
</div>
  </div>

  <div id="game">
    <div id="question">請按任一數字鍵開始</div>
    <div id="info">剩餘時間：30 秒｜答對：0 題</div>
    <div class="num-buttons" id="answerButtons"></div>
    <button id="backBtn" class="back-btn" style="display: none" onclick="backToHome()">返回首頁</button>
  </div>
  <footer>© 2025 速算對決</footer>

  <audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-reward-952.mp3"></audio>
  <audio id="bgm" src="https://cdn.pixabay.com/audio/2022/03/31/audio_7758c3db8d.mp3" loop autoplay></audio>

  <script>
    let timeLeft = 30;
    let correctCount = 0;
    let currentAnswer = 0;
    let timer;
    let gameStarted = false;
    let history = JSON.parse(localStorage.getItem("history") || "[]");

    const maxRecord = () => Math.max(...history, 0);

    const questionEl = document.getElementById("question");
    const infoEl = document.getElementById("info");
    const historyEl = document.getElementById("history");
    // 移除舊按鈕監聽器綁定，因為按鈕是動態產生的
    // const buttons = document.querySelectorAll(".btn");
    const homeEl = document.getElementById("home");
    const gameEl = document.getElementById("game");
    const dingSound = document.getElementById("ding");
    const backBtn = document.getElementById("backBtn");

    function updateHistoryDisplay() {
      const recent = [...history].slice(-3).reverse();
      document.getElementById("recent1").textContent = recent[0] !== undefined ? `${recent[0]} 題` : "--";
      document.getElementById("recent2").textContent = recent[1] !== undefined ? `${recent[1]} 題` : "--";
      document.getElementById("recent3").textContent = recent[2] !== undefined ? `${recent[2]} 題` : "--";
      document.getElementById("bestRecord").textContent = `${maxRecord()} 題`;
    }

    function generateQuestion() {
  const operators = ['+', '-', '×', '÷'];
  let operator = operators[Math.floor(Math.random() * operators.length)];
  let a, b;

  const isHard = window.difficulty === 'hard';
  const max = isHard ? 99 : 20;
  const min = 1;

  if (operator === '+') {
    a = Math.floor(Math.random() * (max - min + 1)) + min;
    b = Math.floor(Math.random() * (max - min + 1)) + min;
    currentAnswer = a + b;
  } else if (operator === '-') {
    a = Math.floor(Math.random() * (max - min + 1)) + min;
    b = Math.floor(Math.random() * (max - min + 1)) + min;
    if (a < b) [a, b] = [b, a];
    currentAnswer = a - b;
  } else if (operator === '×') {
    a = Math.floor(Math.random() * (isHard ? 12 : 3)) + 1;
    b = Math.floor(Math.random() * (isHard ? 12 : 3)) + 1;
    currentAnswer = a * b;
  } else if (operator === '÷') {
    b = Math.floor(Math.random() * (isHard ? 8 : 4)) + 1;
    currentAnswer = Math.floor(Math.random() * 9) + 1;
    a = b * currentAnswer;
  }

  if (currentAnswer < 1 || currentAnswer > 12) {
  generateQuestion();
  return;
}

  questionEl.textContent = `${a} ${operator} ${b} = ?`;
}

    function setDifficulty(level) {
  window.difficulty = level;
  homeEl.classList.remove("active");
  gameEl.classList.add("active");
  backBtn.style.display = "none";
  updateHistoryDisplay();

  const buttonContainer = document.getElementById("answerButtons");
  buttonContainer.innerHTML = "";
  const maxBtn = level === 'hard' ? 12 : 9;
  for (let i = 1; i <= maxBtn; i++) {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = i;
    btn.addEventListener("click", () => {
      const answer = parseInt(btn.textContent);
      if (!gameStarted) {
        if (timeLeft > 0) {
          startGame();
        } else {
          return;
        }
      }
      if (answer === currentAnswer) {
        correctCount++;
        dingSound.play();
      }
      generateQuestion();
      infoEl.textContent = `剩餘時間：${timeLeft} 秒｜答對：${correctCount} 題`;
    });
    buttonContainer.appendChild(btn);
  }
}

    function startGame() {
      correctCount = 0;
      timeLeft = 30;
      gameStarted = true;
      generateQuestion();
      infoEl.textContent = `剩餘時間：${timeLeft} 秒｜答對：${correctCount} 題`;

      timer = setInterval(() => {
        timeLeft--;
        infoEl.textContent = `剩餘時間：${timeLeft} 秒｜答對：${correctCount} 題`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          history.push(correctCount);
          history = history.slice(-10);
          localStorage.setItem("history", JSON.stringify(history));
          questionEl.innerHTML = `<span class='end flash'>時間到！\n你答對了 ${correctCount} 題！</span>`;
          updateHistoryDisplay();
          gameStarted = false;
          backBtn.style.display = "block";
        }
      }, 1000);
    }

    function backToHome() {
      gameEl.classList.remove("active");
      homeEl.classList.add("active");
    }

    // 移除舊按鈕的 click 綁定區段（改由 setDifficulty 裡動態處理）
    });

    updateHistoryDisplay();
  </script>
</body>
</html>
